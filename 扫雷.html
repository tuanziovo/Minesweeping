.th-card{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 6px 10px;border:2px solid transparent;border-radius:18px;background:var(--s1);color:var(--fg);font:inherit;font-size:13px;cursor:pointer}
.th-card:hover{background:var(--s4)}
.th-card.active,.th-card.active:hover{border-color:var(--accent);background:var(--sc)}
.th-sw{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--sw1) 50%,var(--sw2) 50%);box-shadow:inset 0 0 0 1px #0003}
.th-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.th-row input[type=color]{width:56px;height:44px;padding:0;border:0;border-radius:12px;background:none;cursor:pointer}
.th-row input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.th-row input[type=color]::-webkit-color-swatch,.th-row input[type=color]::-moz-color-swatch{border:2px solid var(--border);border-radius:12px}
.th-hint{font-size:12px;color:var(--muted)}
.home-keys{display:none;margin:4px 4px 0;font-size:12px;line-height:1.6;color:var(--muted);text-align:center}
.st-card{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border-radius:20px;background:var(--s3)}
.st-card h4{margin:0;font-size:15px}
.st-sub{font-size:12.5px;color:var(--muted)}
.st-best{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.st-best div{display:flex;flex-direction:column;gap:2px;padding:8px 4px;border-radius:12px;text-align:center;background:var(--s4)}
.st-best small{font-size:11.5px;color:var(--muted)}
.st-best b{font-size:14px;font-variant-numeric:tabular-nums}
.hs-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:var(--s3)}
.hs-badge{flex:none;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--p);color:var(--onp)}
.hs-badge.lose{background:var(--errc);color:var(--onerrc)}
.hs-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;font-size:14px}
.hs-tx span{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hs-tx small{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hs-time{flex:none;font-variant-numeric:tabular-nums;font-weight:700;font-size:14px}
.hs-play{flex:none;width:36px;height:36px}
#sub.rp-mode{background:var(--area-bg);align-items:stretch;overflow:hidden}
#sub.rp-mode .sub-panel{max-width:none;width:100%;height:100%;padding:0;gap:0;zoom:1}
#sub.rp-mode .sub-head{display:none}
#sub.rp-mode #sub-body{flex:1;min-height:0;gap:0!important}
.rp-panel{display:flex;flex-direction:column;flex:1;min-height:0;height:100%}
#rp-bar{flex-shrink:0;min-height:56px;padding:max(8px,env(safe-area-inset-top)) 14px 8px;background:var(--s1);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;box-shadow:0 1px 2px #0000000f}
#rp-stats{display:flex;align-items:center;gap:6px;flex:1;min-width:0}
.rp-board-scroll{flex:1;min-height:0;width:100%;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;padding:8px;background:var(--area-bg);touch-action:none;cursor:grab;user-select:none}
.rp-board-scroll.grabbing{cursor:grabbing}
#rp-wrap{position:relative;padding:var(--board-pad);background:var(--wrap-bg);border-radius:12px;border:1px solid var(--border);box-shadow:0 1px 3px #0000001f;transform-origin:center center;will-change:transform}
body.dark #rp-wrap{box-shadow:0 1px 2px #00000059,0 8px 24px #00000047}
#rp-canvas{display:block}
.rp-dock{flex-shrink:0;display:flex;flex-direction:column;gap:8px;padding:10px 14px max(10px,env(safe-area-inset-bottom));background:var(--s1);border-top:1px solid var(--border)}
.rp-step{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted)}
.rp-range{margin:2px 0;cursor:pointer}
.rp-controls{display:flex;align-items:center;gap:8px;max-width:560px;width:100%;margin:0 auto}
.rp-controls .btn{display:flex;align-items:center;justify-content:center;gap:6px;min-height:42px}
.rp-controls .icon-btn{width:42px;height:42px;padding:0;flex:none}
.rp-controls .btn-primary{flex:1}
.rp-controls #rp-speed{flex:none;min-width:48px;height:42px;padding:0 10px;font-weight:700;font-variant-numeric:tabular-nums}
@media (min-width:900px){#rp-bar,.rp-dock{zoom:var(--ui-zoom,1)}}
@media (max-width:420px){#modal .modal-content{width:min(94vw,380px);border-radius:24px}.modal-icon-wrap{padding:20px 20px 6px}.modal-stats-section,.modal-text-section{padding-left:20px;padding-right:20px}.modal-actions-section{padding:8px 20px 20px}.modal-text-section h2{font-size:24px}}
@media (max-width:640px){#top-bar{padding:7px 8px;gap:5px}#top-bar-actions,#top-bar-stats{gap:4px}.stat-item{padding:3px 5px}.stat-item-timer .stat-row>svg{display:none}.btn:not(.icon-btn){padding:7px 12px}.icon-btn{width:36px}}
@media (max-width:360px){#top-bar-actions,#top-bar-stats{gap:3px}#top-bar-actions .icon-btn{width:30px}#top-bar-actions .btn:not(.icon-btn){padding-left:8px;padding-right:8px}#top-bar-stats .stat-item{padding-left:3px;padding-right:3px}#top-bar-stats .stat-row{gap:2px}#top-bar-stats .stat-item-timer{flex:1.65}}
@media (hover:hover) and (min-width:900px){.home-keys{display:block}}
@media (min-width:900px) and (min-height:640px){:root{--ui-zoom:1.2}}
@media (min-width:1400px) and (min-height:820px){:root{--ui-zoom:1.4}}
@media (min-width:1900px) and (min-height:1000px){:root{--ui-zoom:1.7}}
@media (min-width:2500px) and (min-height:1300px){:root{--ui-zoom:2.1}}
@media (min-width:640px){.home-panel,.sub-panel{max-width:min(760px,92vw);padding-inline:24px}.home-grid{grid-template-columns:repeat(3,1fr)}.th-grid{grid-template-columns:repeat(5,1fr)}}
@media (min-width:900px){#back-confirm>div,#modal .modal-content,#top-bar,.home-panel,.settings-panel,.sub-panel{zoom:var(--ui-zoom,1)}.home-hero{margin-top:auto}.home-nav{margin-inline:-24px;padding-inline:24px;box-shadow:0 0 0 100vmax var(--s2);clip-path:inset(0-100vmax)}.th-grid{grid-template-columns:repeat(6,1fr)}#top-bar{padding-inline:max(14px,calc((100% - 1100px/var(--ui-zoom,1))/2))}.settings-panel{max-height:calc(88vh/var(--ui-zoom,1))}#modal .modal-content{max-height:calc(86vh/var(--ui-zoom,1))}#status-toast{width:fit-content;max-width:90vw;margin-inline:auto}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<noscript><p style="padding:24px;font-family:sans-serif">需要启用 JavaScript 才能玩扫雷。</p></noscript>
<script>try{const s=JSON.parse(localStorage.getItem("minesweeper_settings")||"{}");("boolean"==typeof s.dark?s.dark:matchMedia("(prefers-color-scheme: dark)").matches)&&document.body.classList.add("dark")}catch{}</script>
<svg style="position:absolute;width:0;height:0" aria-hidden="true"><defs><path id="ic-chk" d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/><g id="ic-mine"><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3M4.58 4.58l2.12 2.12M19.42 19.42l-2.12-2.12M19.42 4.58l-2.12 2.12M4.58 19.42l2.12-2.12" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><circle cx="12" cy="12" r="5.8" fill="currentColor"/><ellipse cx="9.8" cy="9.8" rx="1.6" ry="1" fill="rgba(255,255,255,.35)" transform="rotate(-35 9.8 9.8)"/></g><path id="ic-cup" d="M19 5h-2V3H7v2H5c-1.1 0-2 .9-2 2v1c0 2.55 1.92 4.63 4.39 4.94.63 1.5 1.98 2.63 3.61 2.96V19H7v2h10v-2h-4v-3.1c1.63-.33 2.98-1.46 3.61-2.96C19.08 12.63 21 10.55 21 8V7c0-1.1-.9-2-2-2zM5 8V7h2v3.82C5.84 10.4 5 9.3 5 8zm14 0c0 1.3-.84 2.4-2 2.82V7h2v1z"/></defs></svg>
<div id="top-bar">
  <div id="top-bar-stats">
    <div class="stat-item" title="剩余雷数"><div class="stat-row"><svg width="13" height="13" viewBox="0 0 24 24" style="color:var(--boom)" aria-hidden="true"><use href="#ic-mine"/></svg><span class="stat-value" id="mine-count">10</span></div><div class="stat-label">雷</div></div>
    <div class="stat-item stat-item-timer" title="用时"><div class="stat-row"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg><span class="stat-value"><span id="timer-s">0</span><span id="timer-cs" class="cs"></span></span></div><div class="stat-label">用时</div></div>
    <div class="stat-item" title="已插旗"><div class="stat-row"><svg width="12" height="12" viewBox="0 0 24 24" fill="#f59e0b" aria-hidden="true"><path d="M5 21V4h9l.4 2H20v10h-7l-.4-2H7v7H5z"/></svg><span class="stat-value" id="flag-count">0</span></div><div class="stat-label">旗</div></div>
  </div>
  <div id="top-bar-actions">
    <button class="btn icon-btn" id="btn-undo-topbar" title="撤销 (Ctrl+Z)" disabled><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7v6h6M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg></button>
    <button class="btn icon-btn" id="btn-hint" title="提示 (H)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.2 1 2.3h6c0-1.1.4-1.8 1-2.3A7 7 0 0 0 12 2z"/></svg></button>
    <button class="btn btn-primary" id="btn-newgame" title="新游戏 (R)">重开</button>
    <button class="btn icon-btn" id="btn-settings" title="设置"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 15.5A3.5 3.5 0 0 1 8.5 12 3.5 3.5 0 0 1 12 8.5a3.5 3.5 0 0 1 3.5 3.5 3.5 3.5 0 0 1-3.5 3.5m7.43-2.92c.04-.36.07-.73.07-1.08s-.03-.73-.07-1.08l2.32-1.81c.21-.16.27-.46.13-.7l-2.2-3.81c-.13-.24-.42-.32-.66-.24l-2.74 1.1c-.57-.44-1.18-.8-1.86-1.08L14.22 2.4c-.04-.26-.26-.4-.5-.4h-4.4c-.24 0-.46.14-.5.4l-.41 2.48c-.68.28-1.3.64-1.86 1.08l-2.74-1.1c-.24-.09-.53 0-.66.24L1.95 8.41c-.14.24-.08.54.13.7l2.32 1.81C4.36 11.27 4.33 11.64 4.33 12s.03.73.07 1.08L2.08 14.89c-.21.16-.27.46-.13.7l2.2 3.81c.13.24.42.32.66.24l2.74-1.1c.57.44 1.18.8 1.86 1.08l.41 2.48c.04.26.26.4.5.4h4.4c.24 0 .46-.14.5-.4l.41-2.48c.68-.28 1.3-.64 1.86-1.08l2.74 1.1c.24.09.53 0 .66-.24l2.2-3.81c.14-.24.08-.54-.13-.7l-2.32-1.81z"/></svg></button>
  </div>
</div>
<div id="warning-bar" hidden><span>无猜模式生成超时，已回退为传统随机布雷。</span><button id="btn-close-warning" title="关闭">✕</button></div>
<div class="overlay" id="settings-overlay" role="dialog" aria-modal="true" aria-labelledby="settings-title">
  <div class="settings-panel">
    <div class="settings-header"><h3 id="settings-title">设置</h3><button class="btn-close" id="btn-close-settings" aria-label="关闭设置">✕</button></div>
    <div class="settings-content">
      <button class="btn" id="btn-home-settings" style="display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-bottom:12px"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>返回主页</button>
      <div class="settings-grid">
        <section class="settings-section">
          <div class="settings-label">难度</div>
          <div class="settings-list">
            <button class="setting-option" data-set="difficulty" data-val="easy"><span>简单</span><small>9×9 · 10 雷</small></button>
            <button class="setting-option" data-set="difficulty" data-val="medium"><span>中等</span><small>16×16 · 40 雷</small></button>
            <button class="setting-option" data-set="difficulty" data-val="hard"><span>困难</span><small>16×30 · 99 雷</small></button>
            <button class="setting-option" data-set="difficulty" data-val="custom"><span>自定义</span><small>手动设置</small></button>
            <button class="setting-option" data-set="difficulty" data-val="screen"><span>屏幕</span><small>按屏幕自适应</small></button>
          </div>
          <div class="custom-fields" id="custom-fields">
            <div class="custom-form">
              <div class="custom-row"><label for="c-rows">行</label><input id="c-rows" type="number" inputmode="decimal" min="5" max="100" value="12"></div>
              <div class="custom-row"><label for="c-cols">列</label><input id="c-cols" type="number" inputmode="decimal" min="5" max="100" value="16"></div>
              <div class="custom-row"><label for="c-mines">雷<span id="mines-max-hint"></span></label><input id="c-mines" type="number" inputmode="decimal" min="1" value="20"></div>
            </div>
            <p class="density-hint" id="density-hint"></p>
            <button id="btn-apply-custom">应用并重开</button>
          </div>
        </section>
        <section class="settings-section">
          <div class="settings-label">规则</div>
          <div class="settings-buttons segmented"><button class="btn" data-set="mode" data-val="traditional">传统</button><button class="btn" data-set="mode" data-val="noguess">无猜</button></div>
          <div class="range-row"><div class="range-head"><label for="longpress-delay">长按触发时间</label><span id="longpress-delay-value">350 ms</span></div><input id="longpress-delay" class="range-input" type="range" min="100" max="1000" step="50" value="350"></div>
          <div class="custom-row" id="noguess-time-row" hidden><label for="noguess-time-seconds">生成时限</label><input id="noguess-time-seconds" type="number" inputmode="decimal" min="0.1" max="30" step="0.1" value="6"></div>
        </section>
        <section class="settings-section">
          <div class="settings-label">偏好</div>
          <div class="setting-list">
            <div class="toggle-row"><label for="open-theme">主题与配色</label><button class="btn" id="open-theme">打开</button></div>
            <div class="toggle-row"><label for="toggle-dark">深色模式</label><label class="toggle-switch"><input type="checkbox" id="toggle-dark"><span class="toggle-track"></span></label></div>
            <div class="toggle-row"><label for="toggle-sound">音效与震动反馈</label><label class="toggle-switch"><input type="checkbox" id="toggle-sound" checked><span class="toggle-track"></span></label></div>
            <div class="toggle-row"><label for="toggle-question">问号标记</label><label class="toggle-switch"><input type="checkbox" id="toggle-question"><span class="toggle-track"></span></label></div>
            <div class="toggle-row" title="也可使用 Shift + F 切换全屏"><label for="toggle-fullscreen">全屏显示</label><label class="toggle-switch"><input type="checkbox" id="toggle-fullscreen" role="switch" aria-label="全屏显示" aria-checked="false"><span class="toggle-track"></span></label></div>
          </div>
        </section>
        <section class="settings-section">
          <div class="settings-label">操作</div>
          <div class="settings-buttons segmented"><button class="btn" data-set="actionMode" data-val="normal">左开右标</button><button class="btn" data-set="actionMode" data-val="swap">右开左标</button></div>
        </section>
        <section class="settings-section">
          <div class="settings-label">其他</div>
          <div style="padding:0 16px 14px"><button class="btn" id="btn-reset-settings" style="width:100%;justify-content:center;color:var(--err);border-color:var(--err)">重置所有设置</button></div>
        </section>
      </div>
    </div>
  </div>
</div>
<div id="game-area"><div id="board-wrapper"><div id="board"></div></div></div>

  <div class="modal-content">
    <div class="modal-icon-wrap"><div id="modal-icon-circle" class="modal-icon-circle"><div id="modal-icon"></div></div></div>

      <button id="home-settings"><i><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 17v2h6v-2H3zM3 5v2h10V5H3zm10 16v-2h8v-2h-8v-2h-2v6h2zM7 9v2H3v2h4v2h2V9H7zm14 4v-2H11v2h10zm-6-4h2V7h4V5h-4V3h-2v6z"/></svg></i>设置</button>
    </div>
  </div>
</div>
<div class="overlay" id="sub" role="dialog" aria-modal="true" aria-labelledby="sub-title">
  <div class="sub-panel">
    <div class="sub-head"><button class="btn-close" id="sub-back" title="返回"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" style="vertical-align:middle" aria-hidden="true"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button><h2 id="sub-title"></h2></div>

<script>

  const DIFFS = { easy: { rows: 9, cols: 9, mines: 10 }, medium: { rows: 16, cols: 16, mines: 40 }, hard: { rows: 16, cols: 30, mines: 99 }, custom: { rows: 12, cols: 16, mines: 20 }, screen: { rows: 16, cols: 16, mines: 40 } };

  const dom = {

    density: $("density-hint"), maxMinesHint: $("mines-max-hint"),

  const G = {
    difficulty: "medium", mode: "traditional", actionMode: "normal",
    rows: 16, cols: 16, mines: 40,
    board: [], revealed: [], flagged: [], questioned: [],
    flagCount: 0, revealedCount: 0, nonMineCount: 0,
    firstClick: true, placing: false, gameOver: false, hintBusy: false,
    timer: null, time: 0, timeMs: 0, timerStart: 0, gameId: 0, boardVersion: 0,
    undo: [], hinted: [], settlement: null,
    cheated: false, undoUsed: false, noguessFallback: false, hintsUsed: 0, bv3: 0, usefulClicks: 0,
    soundEnabled: true, questionMarkEnabled: false, noguessTimeSeconds: 6, longPressDelay: 350,

  const R = {
    cells: null, dirty: new Set(), animating: new Set(),
    canvas: null, ctx: null, geo: null, palette: null,
    paintFrame: 0, fullRepaint: false, repaintProgress: null, hoverCell: null,
    scale: 1, minScale: 0.5, maxScale: 4, offset: { x: 0, y: 0 }, cellSize: 30,
    pan: null, panArm: null, pinch: null, moved: false, longPress: false, dragging: false,
    pressCancelled: false, ignoreMouse: false, wasPinching: false,
    touch: null, currentCell: null, mouseCell: null, chord: null, snap: null,

  // Viewport height sync for mobile virtual keyboard / URL bar

  // Timer

  function renderTimer() {
    const s = fmtSec(G.time), cs = G.firstClick ? "" : "." + pad2(Math.floor((G.timeMs % 1e3) / 10));

  function setElapsed(ms) {
    G.timeMs = Math.min(ms, 9999e3);

  }

    if (G.timer) return;

      setElapsed(performance.now() - G.timerStart);

  }

  // Board helpers
  const idxOf = (r, c) => r * G.cols + c;

  const inBounds = (r, c) => r >= 0 && r < G.rows && c >= 0 && c < G.cols;
  const isNumbered = (r, c) => G.revealed[r]?.[c] && G.board[r][c] > 0;
  const primaryAct = () => (G.actionMode === "normal" ? revealCell : toggleFlag);
  const secondaryAct = () => (G.actionMode === "normal" ? toggleFlag : revealCell);
  const clearTimer = (name) => { clearTimeout(R.timers[name]); R.timers[name] = null; };
  const getNeighbors = (r, c) => {

  function showToast(msg, ms = 0) {

  }

  const isUiBlocked = () =>

  // Settings
  function syncLongPressUI(val = G.longPressDelay) {

  function setInvalid(el, bad) {

  }

  function setSetting(key, val, save = true) {

  function openSettings() {

  function closeSettings(force) {
    dom.settings.classList.remove("show");

    if (G.difficulty === "custom") {
      const cfg = applyCustomInputs({ shouldSave: false });
      customChanged = R.snap?.difficulty === "custom" && R.snap?.customParams !== `${cfg.rows},${cfg.cols},${cfg.mines}`;
    }
    const changed = !!R.snap && (R.snap.difficulty !== G.difficulty || R.snap.mode !== G.mode);
    if (!force && (changed || customChanged) && !G.firstClick && !G.gameOver && !G.placing) {
      const now = Date.now();

      R.settingsPaused = false;

  }

  // Audio & haptics
  function ensureAudio() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    if (!R.audio || R.audio.state === "closed") {
      R.audio = new AC(); R.audioOut = null; R.noiseBuffer = null; R.voices = 0;
    }
    if (R.audio.state === "suspended") R.audio.resume().catch(() => {});
    return R.audio;
  }
  function audioOut(ac) {
    if (!R.audioOut) {
      const comp = ac.createDynamicsCompressor();
      comp.threshold.value = -14; comp.knee.value = 12; comp.ratio.value = 6; comp.attack.value = 0.003; comp.release.value = 0.12;
      const gain = ac.createGain();
      gain.gain.value = 0.9; gain.connect(comp); comp.connect(ac.destination);
      R.audioOut = gain;
    }
    return R.audioOut;
  }
  function noiseBuf(ac) {
    if (!R.noiseBuffer) {
      const len = Math.ceil(1.5 * ac.sampleRate), buf = ac.createBuffer(1, len, ac.sampleRate), ch = buf.getChannelData(0);
      for (let i = 0; i < len; i++) ch[i] = 2 * Math.random() - 1;
      R.noiseBuffer = buf;
    }
    return R.noiseBuffer;
  }
  function playVoice(ac, src, outNode, dur, vol, delay, attack, offset = 0) {
    const t = ac.currentTime + delay, g = ac.createGain();
    outNode.connect(g); g.connect(audioOut(ac));
    g.gain.setValueAtTime(1e-4, t);
    g.gain.linearRampToValueAtTime(vol, t + attack);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    R.voices = (R.voices || 0) + 1;
    src.onended = () => { R.voices = Math.max(0, R.voices - 1); };
    offset ? src.start(t, offset) : src.start(t);
    src.stop(t + dur + 0.02);
  }
  function tone({ type = "sine", frequency = 440, endFrequency = frequency, duration = 0.08, volume = 0.2, delay = 0, attack = 0.004 }) {
    if (!G.soundEnabled) return;
    try {
      const ac = ensureAudio();
      if (!ac || (R.voices || 0) >= 40) return;
      const osc = ac.createOscillator(), t = ac.currentTime + delay;
      osc.type = type;
      osc.frequency.setValueAtTime(frequency, t);
      if (endFrequency !== frequency) osc.frequency.exponentialRampToValueAtTime(endFrequency, t + duration);
      playVoice(ac, osc, osc, duration, volume, delay, attack);
    } catch {}
  }
  function noise({ duration = 0.1, volume = 0.3, filter = "lowpass", cutoff = 400, endCutoff = cutoff, q = 0.7, delay = 0 }) {
    if (!G.soundEnabled) return;
    try {
      const ac = ensureAudio();
      if (!ac || (R.voices || 0) >= 40) return;

  }

  const NOTE_SINGLE = [392, 440, 494, 523, 587, 659, 698, 784, 880];
  const NOTE_CHORD = [523, 587, 659, 784, 880, 1047, 1175];
  const SFX = {
    reveal: ({ count = 1, value = 0 } = {}) => {
      noise({ duration: 0.03, volume: 0.1, filter: "highpass", cutoff: 2500 });
      if (count <= 1) {
        const f = NOTE_SINGLE[clamp(value, 0, 8)] * (1 + 0.02 * (Math.random() - 0.5));
        tone({ type: "triangle", frequency: f, endFrequency: 0.96 * f, duration: 0.11, volume: 0.17 });
        tone({ frequency: 2 * f, duration: 0.06, volume: 0.05 });
        return;
      }
      const n = Math.min(7, 3 + Math.floor(Math.log2(count))), span = Math.min(0.6, 0.16 + 0.004 * count);
      for (let i = 0; i < n; i++) {
        const p = i / (n - 1);
        tone({ type: "triangle", frequency: NOTE_CHORD[i % NOTE_CHORD.length] * (i >= NOTE_CHORD.length ? 2 : 1), duration: 0.13, volume: 0.1 + 0.05 * p, delay: p * span });
      }

    },
    flag: () => {
      noise({ duration: 0.03, volume: 0.1, cutoff: 900 });

      tone({ type: "triangle", frequency: 880, duration: 0.05, volume: 0.08, delay: 0.05 });
    },
    unflag: () => tone({ frequency: 660, endFrequency: 400, duration: 0.08, volume: 0.12 }),
    undo: () => {
      tone({ type: "triangle", frequency: 500, endFrequency: 250, duration: 0.14, volume: 0.13 });

    },
    question: () => {
      tone({ frequency: 784, endFrequency: 988, duration: 0.07, volume: 0.11 });

    },
    deny: () => [0, 0.11].forEach((d) => tone({ type: "square", frequency: 180, endFrequency: 140, duration: 0.1, volume: 0.07, delay: d })),
    hint: () => [1047, 1319, 1568, 2093].forEach((f, i) => tone({ frequency: f, duration: 0.12, volume: 0.07, delay: 0.06 + 0.05 * i })),
    newgame: () => {
      noise({ duration: 0.22, volume: 0.08, filter: "bandpass", cutoff: 300, endCutoff: 1800, q: 0.9 });

    },
    explode: () => {
      noise({ duration: 0.55, volume: 0.35, cutoff: 1400, endCutoff: 80, q: 0.8 });
      tone({ frequency: 110, endFrequency: 32, duration: 0.5, volume: 0.22 });
      for (let i = 0; i < 6; i++) noise({ duration: 0.05, volume: 0.1, filter: "highpass", cutoff: 1800, delay: 0.05 + 0.07 * i + 0.03 * Math.random() });
    },
    win: () => {
      [[523, 0], [659, 0.1], [784, 0.2], [1047, 0.32], [784, 0.5], [1047, 0.62], [1319, 0.74]].forEach(([f, d], i, a) => {
        const last = i === a.length - 1;
        tone({ type: "triangle", frequency: f, duration: last ? 0.7 : 0.16, volume: 0.15, delay: d });
        tone({ frequency: 2 * f, duration: last ? 0.6 : 0.12, volume: 0.05, delay: d });
      });
      for (let i = 0; i < 6; i++) tone({ frequency: 2093 + 1500 * Math.random(), duration: 0.08, volume: 0.03, delay: 0.8 + 0.07 * i });
    },
    tap: () => tone({ type: "triangle", frequency: 620, endFrequency: 520, duration: 0.04, volume: 0.08 }),
    select: () => tone({ frequency: 520, endFrequency: 700, duration: 0.06, volume: 0.09 }),
    unlock: () => {
      tone({ type: "triangle", frequency: 784, duration: 0.12, volume: 0.12 });
      tone({ type: "triangle", frequency: 1175, duration: 0.24, volume: 0.12, delay: 0.1 });
      tone({ frequency: 2350, duration: 0.14, volume: 0.03, delay: 0.1 });
    },
  };

  // Hint system

  function pickLowestProb(probs, frontier, unsolved) {

    const remM = clamp(G.mines - G.flagCount, 0, unrev);
    let best = null;
    probs.forEach((p, k) => { if (!best || p < best.prob) best = { row: Math.floor(k / G.cols), col: k % G.cols, prob: p }; });

        for (let r = 0; r < G.rows; r++) for (let c = 0; c < G.cols; c++)

  const flashHint = (r, c) => { cellAt(r, c)?.add("hint-flash"); playFeedback("hint"); };
  async function requestHint() {
    if (G.firstClick) return showToast("先翻开一格再用提示", 1800);
    if (G.placing) return showToast("棋盘生成中", 1500);
    if (G.gameOver) return showToast("本局已结束", 1500);
    if (G.hintBusy) return;
    if (G.flagged.some((row, r) => row.some((f, c) => f && G.board[r][c] !== -1))) {
      G.cheated = true; G.hintsUsed++;
      return showToast("有旗子插错了，提示不可靠，已计为使用提示", 2400);
    }
    G.hintBusy = true;
    const gid = G.gameId, ver = G.boardVersion, btn = $("btn-hint");
    if (btn) btn.disabled = true;
    const done = () => { if (G.gameId === gid) G.hintBusy = false; if (btn && !G.hintBusy) btn.disabled = false; };
    let res;
    try { res = await runHintSolver(); }
    catch {
      done();
      if (G.gameId === gid) showToast("提示计算失败，请重试", 1800);
      return;
    }
    done();
    if (G.gameId !== gid || G.boardVersion !== ver || G.gameOver) return;
    if (res.invalid) return showToast("标记自相矛盾", 2400);

  }

  // Worker pool for no-guess generation
  let pool = null, poolSeq = 0;
  const poolCbs = new Array(WORKER_COUNT).fill(null), poolIds = new Array(WORKER_COUNT).fill(0);
  function spawnPoolWorker(i) {
    const w = createSolverWorker();
    w.onmessage = (e) => { if (e.data.id === poolIds[i]) { const cb = poolCbs[i]; poolCbs[i] = null; poolIds[i] = 0; cb?.(e.data.result); } };
    w.onerror = () => { const cb = poolCbs[i]; poolCbs[i] = null; poolIds[i] = 0; if (pool?.[i] === w) { w.terminate(); pool[i] = null; } cb?.(false); };

  }
  function abortWorkers() {
    for (let i = 0; i < poolCbs.length; i++) {
      const cb = poolCbs[i]; poolCbs[i] = null; poolIds[i] = 0;
      if (cb && pool?.[i]) { pool[i].terminate(); pool[i] = null; }
      cb?.(null);
    }
  }
  function raceGenerate(rows, cols, mines, sr, sc, deadline) {
    abortWorkers();

    for (let i = 0; i < WORKER_COUNT; i++) pool[i] || (pool[i] = spawnPoolWorker(i));
    return new Promise((resolve) => {
      let rem = pool.length, done = false;
      const finish = (v) => { if (!done) { done = true; resolve(v); } };
      pool.forEach((w, i) => {
        const id = ++poolSeq;
        poolIds[i] = id;
        poolCbs[i] = (res) => { if (!done) (res && Array.isArray(res.board) ? finish(res) : res === null ? finish(null) : --rem === 0 && finish(false)); };

        catch { const cb = poolCbs[i]; poolCbs[i] = null; poolIds[i] = 0; cb?.(false); }

    });
  }
  async function generateFirstClickBoard(sr, sc, gid) {
    if (G.mode !== "noguess") return placeTraditionalBoard(sr, sc);
    const minSec = window.MineHome?.run?.key === "camp" ? 20 : 0;
    const ms = Math.round(1e3 * Math.max(clampNgSec(G.noguessTimeSeconds), minSec)), t0 = Date.now();
    const left = () => Math.max(0, ms - (Date.now() - t0));
    const tickToast = () => { if (G.gameId === gid) showToast(`生成无猜棋盘，剩余 ${Math.ceil(left() / 1e3)} 秒`, 0); };
    tickToast();
    const iv = setInterval(tickToast, 500);
    let tm = 0;
    try {
      const work = (async () => {
        while (left() > 0 && G.gameId === gid) {
          const res = await raceGenerate(G.rows, G.cols, G.mines, sr, sc, Date.now() + left());
          if (G.gameId !== gid) return null;
          if (res && Array.isArray(res.board)) return res;
          if (left() <= 0) return false;
          if (res === false) {
            await new Promise((r) => setTimeout(r, 50));
          }
        }
        return G.gameId !== gid && null;
      })();
      const timeout = new Promise((r) => { tm = setTimeout(() => { abortWorkers(); r(false); }, left()); });
      const res = await Promise.race([work, timeout]);

      if (!res) { abortWorkers(); throw new Error(left() <= 0 ? "超时" : "生成失败"); }

      G.mines = res.board.flat().filter((v) => v === -1).length;
      G.nonMineCount = G.rows * G.cols - G.mines;

    } finally { clearTimeout(tm); clearInterval(iv); }
  }

  function endGame(win, boomR = -1, boomC = -1) {

        const flags = [];

          if (G.board[r][c] === -1 && !G.flagged[r][c]) { G.flagged[r][c] = true; G.flagCount++; G.questioned[r][c] = false; flags.push([r, c]); }

      }

    });

      if (!R.pan) {

        if (!(e.buttons & 1)) { R.panArm = null; return; }

        startPan(R.panArm.x, R.panArm.y); R.panArm = null;
      }
