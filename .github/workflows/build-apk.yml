name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Unzip project archive if needed
        run: |
          if [ ! -f "package.json" ]; then
            if [ -f "minesweeper.zip" ]; then
              unzip -o minesweeper.zip
            elif [ -f "minesweeper-github-app.zip" ]; then
              unzip -o minesweeper-github-app.zip
            else
              echo "未找到 package.json 或压缩包"
              exit 1
            fi
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Add and sync Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Apply custom app icons
        run: |
          if [ -d "android-icons" ]; then
            cp -r android-icons/* android/app/src/main/res/
          fi

      - name: Add VIBRATE permission to AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "android.permission.VIBRATE" "$MANIFEST"; then
            sed -i 's|</manifest>|    <uses-permission android:name="android.permission.VIBRATE" />\n</manifest>|' "$MANIFEST"
          fi

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: minesweeper-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
