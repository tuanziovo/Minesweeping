name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Unzip project archive if needed
        run: |
          if [ ! -f "package.json" ]; then
            if [ -f "minesweeper.zip" ]; then
              unzip -o minesweeper.zip
            elif [ -f "minesweeper-github-app.zip" ]; then
              unzip -o minesweeper-github-app.zip
            else
              echo "未找到 package.json 或压缩包"
              exit 1
            fi
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm install

      - name: Add and sync Android platform
        env:
          # 可选：在仓库 Secrets 配置私有密钥，未配置则用 signing/ 里自带的固定密钥
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Apply custom app icons
        run: |
          if [ -d "android-icons" ]; then
            cp -r android-icons/* android/app/src/main/res/
          fi

      - name: Add VIBRATE permission to AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "android.permission.VIBRATE" "$MANIFEST"; then
            sed -i 's|</manifest>|    <uses-permission android:name="android.permission.VIBRATE" />\n</manifest>|' "$MANIFEST"
          fi

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Show APK version
        run: |
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt2 2>/dev/null | tail -1)
          [ -n "$AAPT" ] && "$AAPT" dump badging android/app/build/outputs/apk/debug/app-debug.apk | grep -E "^package:" || true

      - name: Show APK signing certificate
        run: |
          keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk | grep -E "Owner|SHA256"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v5
        with:
          name: minesweeper-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
